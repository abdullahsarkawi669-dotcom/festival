<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Festival Abu Hurairah ke-13</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Semua Database Santri -->
    <script src="data_smp_putra.js"></script>
    <script src="data_smp_putri.js"></script>
    <script src="data_sma_fullday.js"></script>
    <script src="data_sma_putri.js"></script>
    <script src="data_ma_plus.js"></script>
    <script src="data_sd_putra.js"></script>
    <script src="data_sd_putri.js"></script>
    <script src="data_smp_fullday.js"></script>
    <script src="data_pgmi.js"></script>
    <script src="data_sma_ibs_bali.js"></script>
    <script src="data_ulya.js"></script>
    <script src="data_wustho.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    
    <div id="app" class="max-w-5xl mx-auto p-4 md:p-6 mt-4">
        <div class="text-center mb-8 relative">
            <h1 class="text-3xl font-bold text-green-700 mb-2">Festival Abu Hurairah ke-13</h1>
            <p class="text-gray-500" id="subtitle">Pendataan Peserta Lomba Tahun 2026</p>
            <button onclick="bukaDashboardRekap()" class="mt-4 px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded shadow hover:bg-blue-700 transition">Lihat Rekap Pendaftar</button>
        </div>

        <!-- LAYAR 1: Pilih Gender -->
        <div id="screen-gender" class="bg-white rounded-xl shadow-sm p-6 text-center transition">
            <h2 class="text-xl font-semibold mb-6">Pilih Kategori</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="setGender('PUTRA')" class="py-12 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl border-2 border-blue-200 text-2xl transition">PUTRA</button>
                <button onclick="setGender('PUTRI')" class="py-12 bg-pink-50 hover:bg-pink-100 text-pink-700 font-bold rounded-xl border-2 border-pink-200 text-2xl transition">PUTRI</button>
            </div>
        </div>

        <!-- LAYAR 2: Pilih Lembaga -->
        <div id="screen-lembaga" class="hidden bg-white rounded-xl shadow-sm p-6 transition">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2 flex justify-between">
                Pilih Lembaga
                <button onclick="adminBack()" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300">Kembali</button>
            </h2>
            <div id="list-lembaga" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4"></div>
            <p class="text-sm text-red-500 mt-4">*Setelah dipilih, aplikasi akan terkunci pada Sekolah ini.</p>
        </div>

        <!-- LAYAR 3: Pilih Kelas -->
        <div id="screen-kelas" class="hidden bg-white rounded-xl shadow-sm p-6 transition">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2 flex justify-between items-center">
                Pilih Kelas
                <button onclick="adminBackLembaga()" class="text-sm bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 font-bold">Admin: Ganti Lembaga</button>
            </h2>
            <div id="list-kelas" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        </div>

        <!-- LAYAR 4: Dashboard Entry Lomba -->
        <div id="screen-dashboard" class="hidden">
            <div class="bg-green-600 text-white p-4 rounded-xl shadow-sm mb-6 flex justify-between items-center flex-wrap gap-2">
                <div>
                    <p class="text-sm text-green-100" id="dash-lembaga">Lembaga</p>
                    <h3 class="text-2xl font-bold">Kelas <span id="dash-kelas"></span></h3>
                </div>
                <div class="flex gap-2">
                    <button onclick="gantiKelas()" class="bg-white text-green-700 px-4 py-2 rounded text-sm font-bold shadow-sm hover:bg-green-50 transition">Ganti Kelas</button>
                    <button onclick="adminBackLembaga()" class="bg-red-500 text-white px-4 py-2 rounded text-sm font-bold shadow-sm hover:bg-red-600 transition">Admin</button>
                </div>
            </div>

            <div class="flex gap-4 mb-6 border-b pb-4">
                <button onclick="setMode('lomba')" id="btn-mode-lomba" class="flex-1 py-3 bg-white text-green-700 font-bold rounded-lg border border-green-200 shadow-sm transition">Entry via Mata Lomba</button>
                <button onclick="setMode('santri')" id="btn-mode-santri" class="flex-1 py-3 bg-white text-gray-600 font-semibold rounded-lg border border-gray-200 transition hover:bg-gray-50">Entry via Nama Santri</button>
            </div>

            <div id="mode-lomba" class="hidden space-y-6"></div>
            
            <div id="mode-santri" class="hidden bg-white rounded-xl shadow-sm p-6">
                <input type="text" id="search-santri" onkeyup="searchSantri()" placeholder="Ketik nama santri..." class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
                <div id="list-santri-search" class="space-y-2 max-h-[60vh] overflow-y-auto"></div>
            </div>
        </div>
        
        <!-- LAYAR 5: Rekap Dashboard -->
        <div id="screen-rekap" class="hidden bg-white rounded-xl shadow-sm p-6 transition">
            <div class="flex justify-between items-center mb-6 border-b pb-2">
                <h2 class="text-2xl font-bold text-gray-800">Rekapitulasi Peserta</h2>
                <button onclick="tutupRekap()" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded hover:bg-gray-300">Tutup</button>
            </div>
            <div id="rekap-loading" class="text-center py-10 text-gray-500">Memuat data dari Google Sheet...</div>
            <div id="rekap-content" class="space-y-8 hidden"></div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-bold text-lg text-gray-800" id="modal-title">Kelola Peserta</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500 text-3xl leading-none">&times;</button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1 space-y-4" id="modal-content"></div>
            
            <div class="p-4 border-t bg-white flex justify-end">
                <button id="btn-simpan-modal" class="px-6 py-2 bg-green-600 text-white font-bold rounded-lg hover:bg-green-700 shadow-sm transition w-full sm:w-auto">Simpan Pilihan</button>
            </div>
        </div>
    </div>

    <script>
        const LEMBAGA = [
            { id: "sd_putra", nama: "SD IT Putra Abhur Mataram", gender: "PUTRA", jenjang: "SD" },
            { id: "sd_putri", nama: "SD IT Putri Abhur Mataram", gender: "PUTRI", jenjang: "SD" },
            { id: "sd_sembalun_pa", nama: "SD IT Sembalun (Putra)", gender: "PUTRA", jenjang: "SD" },
            { id: "sd_sembalun_pi", nama: "SD IT Sembalun (Putri)", gender: "PUTRI", jenjang: "SD" },
            { id: "smp_putra", nama: "SMP IT Putra Abhur Mataram", gender: "PUTRA", jenjang: "SMP" },
            { id: "smp_fullday", nama: "SMP IT Putra Fullday", gender: "PUTRA", jenjang: "SMP" },
            { id: "smp_putri", nama: "SMP IT Putri Abhur Mataram", gender: "PUTRI", jenjang: "SMP" },
            { id: "smp_sumbawa_pa", nama: "SMP IT Abhur Sumbawa (Putra)", gender: "PUTRA", jenjang: "SMP" },
            { id: "smp_sumbawa_pi", nama: "SMP IT Abhur Sumbawa (Putri)", gender: "PUTRI", jenjang: "SMP" },
            { id: "sma_fullday", nama: "SMA IT Putra Fullday", gender: "PUTRA", jenjang: "SMA" },
            { id: "sma_putri", nama: "SMA IT Putri Abhur Mataram", gender: "PUTRI", jenjang: "SMA" },
            { id: "sma_ibs_bali", nama: "SMA IBS AH", gender: "PUTRA", jenjang: "SMA" },
            { id: "ma_plus", nama: "MA Plus Mataram", gender: "PUTRA", jenjang: "SMA" },
            { id: "wustho", nama: "PPS Diniyah Wustho", gender: "PUTRA", jenjang: "SMP" },
            { id: "ulya", nama: "PPS Diniyah Ulya", gender: "PUTRA", jenjang: "SMA" },
            { id: "pgmi", nama: "PGMI", gender: "PUTRI", jenjang: "PGMI" }
        ];

        const MATA_LOMBA = {
            "SD": {
                "Bahasa": ["[SD] Pidato B.Indo (1-3)", "[SD] Pidato B.Indo (4-6)", "[SD] Puisi B.Indo (1-3)", "[SD] Puisi B.Indo (4-6)", "[SD] Cerita B.Indo (1-3)", "[SD] Cerita B.Indo (4-6)", "[SD] Pidato B.Arab (1-3)", "[SD] Pidato B.Arab (4-6)", "[SD] Cerita B.Arab (1-3)", "[SD] Cerita B.Arab (4-6)", "[SD] Story Telling (4-6)"],
                "UTHQ": ["[SD] Tahfizh 3 Juz (28-30)", "[SD] Tahfizh 10 Juz (1-10)", "[SD] Tahfizh 10 Juz (1-5, 26-30)", "[SD] Tahfizh 10 Juz (21-30)", "[SD] Tahfizh 15 Juz (1-15)", "[SD] Tahfizh 15 Juz (16-30)"],
                "KLIK": ["[SD] Cerpen (4-6)"]
            },
            "SMP": {
                "Bahasa": ["[SMP] Pidato B.Indo", "[SMP] Puisi B.Indo", "[SMP] Pidato B.Arab", "[SMP] Cerita B.Arab", "[SMP] Syair B.Arab", "[SMP] Pidato B.Inggris", "[SMP] Story Telling"],
                "UTHQ": ["[SMP] Tahfizh 3 Juz", "[SMP] Tahfizh 5 Juz (1-5)", "[SMP] Tahfizh 5 Juz (26-30)", "[SMP] Tahfizh 10 Juz (1-10)", "[SMP] Tahfizh 10 Juz (1-5, 26-30)", "[SMP] Tahfizh 10 Juz (21-30)", "[SMP] Tahfizh 15 Juz (1-15)", "[SMP] Tahfizh 15 Juz (16-30)"],
                "KLIK": ["[SMP] Resensi Buku"]
            },
            "SMA": {
                "Bahasa": ["[SMA] Pidato B.Indo", "[SMA] Puisi B.Indo", "[SMA] Pidato B.Arab", "[SMA] Cerita B.Arab", "[SMA] Syair B.Arab", "[SMA] Qira'atul Kutub", "[SMA] Hifzhul Mutun", "[SMA] Pidato B.Inggris", "[SMA] Story Telling"],
                "UTHQ": ["[SMA] Tahfizh 5 Juz (1-5)", "[SMA] Tahfizh 5 Juz (26-30)", "[SMA] Tahfizh 10 Juz (1-10)", "[SMA] Tahfizh 10 Juz (1-5, 26-30)", "[SMA] Tahfizh 10 Juz (21-30)", "[SMA] Tahfizh 15 Juz (1-15)", "[SMA] Tahfizh 15 Juz (16-30)"],
                "KLIK": ["[SMA] Majalah Dinding", "[SMA] Resensi Buku", "[SMA] Esai", "[SMA] Khutbah Jum'at"]
            },
            "PGMI": {
                "Bahasa": ["[PGMI] Qira'atul Kutub"],
                "UTHQ": ["[PGMI] Tahfizh 5 Juz (1-5)", "[PGMI] Tahfizh 5 Juz (26-30)", "[PGMI] Tahfizh 10 Juz (1-10)", "[PGMI] Tahfizh 10 Juz (11-20)", "[PGMI] Tahfizh 10 Juz (21-30)", "[PGMI] Tahfizh 15 Juz (1-15)", "[PGMI] Tahfizh 15 Juz (16-30)"],
                "KLIK": ["[PGMI] Majalah Dinding", "[PGMI] Resensi Buku", "[PGMI] Esai", "[PGMI] Khutbah Jum'at"]
            }
        };

        let currentLembaga = {};
        let currentKelas = "";
        let listSantriAktif = [];
        let stateEntry = {}; 
        let currentLombaAktif = ""; 
        let currentModalContext = ""; 
        let currentSantriAktif = ""; 
        let previousScreen = "";
        
        // GANTI DENGAN URL GAS ANDA JIKA BERUBAH
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyF7zML5CqS2mNZeYaxWqFQwOYLDVYZsDF7EcFygf4KqoMO378aA_fxxaeEXXiqQY6N/exec";

        window.onload = () => {
            const saved = localStorage.getItem("app_audisi_session");
            if (saved) {
                const session = JSON.parse(saved);
                currentLembaga = session.lembaga;
                if (session.kelas) {
                    currentKelas = session.kelas;
                    loadSantriData();
                    showScreen("dashboard");
                } else {
                    renderKelasOptions();
                    showScreen("kelas");
                }
            }
        };

        function showScreen(screenId) {
            if(screenId !== 'rekap') {
                previousScreen = screenId;
            }
            ["screen-gender", "screen-lembaga", "screen-kelas", "screen-dashboard", "screen-rekap"].forEach(id => {
                document.getElementById(id).classList.add("hidden");
            });
            document.getElementById(`screen-${screenId}`).classList.remove("hidden");
            
            if (screenId === "dashboard") {
                document.getElementById("dash-lembaga").innerText = currentLembaga.nama;
                document.getElementById("dash-kelas").innerText = currentKelas;
                setMode('lomba');
            }
        }

        function adminBack() {
            showScreen("gender");
        }

        function adminBackLembaga() {
            const pwd = prompt("Masukkan Password Admin:");
            if (pwd === "agus133") {
                localStorage.removeItem("app_audisi_session");
                showScreen("gender");
            } else if (pwd !== null) {
                alert("Password Salah!");
            }
        }

        function setGender(gender) {
            const listDiv = document.getElementById("list-lembaga");
            listDiv.innerHTML = "";
            const filtered = LEMBAGA.filter(l => l.gender === gender);
            
            const disabledIds = ["sd_sembalun_pa", "sd_sembalun_pi", "smp_sumbawa_pa", "smp_sumbawa_pi"];

            filtered.forEach(lembaga => {
                const btn = document.createElement("button");
                
                if (disabledIds.includes(lembaga.id)) {
                    btn.disabled = true;
                    btn.className = "p-4 border rounded-lg text-left bg-gray-100 opacity-60 cursor-not-allowed shadow-sm";
                    btn.innerHTML = `<span class="block font-bold text-gray-500">${lembaga.nama}</span><span class="text-xs text-red-500 font-semibold">Belum Ada Data</span>`;
                } else {
                    btn.className = "p-4 border rounded-lg text-left bg-white hover:bg-green-50 focus:ring focus:ring-green-200 transition shadow-sm";
                    btn.innerHTML = `<span class="block font-bold text-gray-800">${lembaga.nama}</span><span class="text-xs text-gray-500">${lembaga.jenjang}</span>`;
                    btn.onclick = () => setLembaga(lembaga);
                }
                
                listDiv.appendChild(btn);
            });
            showScreen("lembaga");
        }

        function setLembaga(lembaga) {
            currentLembaga = lembaga;
            localStorage.setItem("app_audisi_session", JSON.stringify({ lembaga: currentLembaga }));
            renderKelasOptions();
            showScreen("kelas");
        }

        function getDBForLembaga(idLembaga) {
            if (idLembaga === "smp_putra" && typeof DATA_SANTRI_SMP_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMP_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "smp_putri" && typeof DATA_SANTRI_SMP_PUTRI_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMP_PUTRI_ABHUR_MATARAM;
            if (idLembaga === "sma_fullday" && typeof DATA_SANTRI_SMA_FULLDAY_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMA_FULLDAY_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "sma_putri" && typeof DATA_SANTRI_SMA_IT_PUTRI_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMA_IT_PUTRI_ABHUR_MATARAM;
            if (idLembaga === "ma_plus" && typeof DATA_SANTRI_MA_PLUS_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_MA_PLUS_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "sd_putra" && typeof DATA_SANTRI_SD_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SD_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "sd_putri" && typeof DATA_SANTRI_SD_PUTRI_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SD_PUTRI_ABHUR_MATARAM;
            if (idLembaga === "smp_fullday" && typeof DATA_SANTRI_SMP_FULLDAY_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMP_FULLDAY_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "pgmi" && typeof DATA_MAHASISWA_PGMI_PUTRI_ABHUR_MATARAM !== "undefined") return DATA_MAHASISWA_PGMI_PUTRI_ABHUR_MATARAM;
            if (idLembaga === "sma_ibs_bali" && typeof DATA_SANTRI_SMA_IBS_AH_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_SMA_IBS_AH_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "ulya" && typeof DATA_SANTRI_PPS_ULYA_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_PPS_ULYA_PUTRA_ABHUR_MATARAM;
            if (idLembaga === "wustho" && typeof DATA_SANTRI_PPS_WUSTHO_PUTRA_ABHUR_MATARAM !== "undefined") return DATA_SANTRI_PPS_WUSTHO_PUTRA_ABHUR_MATARAM;
            return {};
        }

        function renderKelasOptions() {
            const classDiv = document.getElementById("list-kelas");
            classDiv.innerHTML = "";
            
            let db = getDBForLembaga(currentLembaga.id);

            if (Object.keys(db).length === 0) {
                alert("Database santri untuk lembaga ini belum dimuat (file .js belum tersedia atau belum ditambahkan).");
                return;
            }

            Object.keys(db).forEach(kls => {
                const btn = document.createElement("button");
                btn.className = "py-3 px-4 border rounded-lg font-bold text-gray-700 hover:bg-green-500 hover:text-white transition shadow-sm";
                btn.innerText = kls;
                btn.onclick = () => {
                    currentKelas = kls;
                    localStorage.setItem("app_audisi_session", JSON.stringify({ lembaga: currentLembaga, kelas: currentKelas }));
                    loadSantriData(db[kls]);
                    showScreen("dashboard");
                };
                classDiv.appendChild(btn);
            });
        }

        function gantiKelas() {
            localStorage.setItem("app_audisi_session", JSON.stringify({ lembaga: currentLembaga }));
            currentKelas = "";
            renderKelasOptions();
            showScreen("kelas");
        }

        function loadSantriData(dataArr) {
            if(dataArr) {
                listSantriAktif = dataArr;
            } else {
                let db = getDBForLembaga(currentLembaga.id);
                listSantriAktif = db[currentKelas] || [];
            }
            
            listSantriAktif.forEach(s => {
                if(typeof stateEntry[s] === 'undefined') stateEntry[s] = [];
            });
        }

        function setMode(mode) {
            const btnLomba = document.getElementById("btn-mode-lomba");
            const btnSantri = document.getElementById("btn-mode-santri");
            
            if (mode === 'lomba') {
                btnLomba.className = "flex-1 py-3 bg-white text-green-700 font-bold rounded-lg border border-green-200 shadow-sm transition";
                btnSantri.className = "flex-1 py-3 bg-white text-gray-600 font-semibold rounded-lg border border-gray-200 transition hover:bg-gray-50";
                document.getElementById("mode-lomba").classList.remove("hidden");
                document.getElementById("mode-santri").classList.add("hidden");
                renderCardsLomba();
            } else {
                btnSantri.className = "flex-1 py-3 bg-white text-green-700 font-bold rounded-lg border border-green-200 shadow-sm transition";
                btnLomba.className = "flex-1 py-3 bg-white text-gray-600 font-semibold rounded-lg border border-gray-200 transition hover:bg-gray-50";
                document.getElementById("mode-santri").classList.remove("hidden");
                document.getElementById("mode-lomba").classList.add("hidden");
                searchSantri();
            }
        }

        // ================= MODE 1: ENTRY VIA LOMBA =================
        function renderCardsLomba() {
            const container = document.getElementById("mode-lomba");
            container.innerHTML = "";
            const jenjangLomba = MATA_LOMBA[currentLembaga.jenjang];
            
            for (let cabang in jenjangLomba) {
                const wrapper = document.createElement("div");
                wrapper.innerHTML = `<h3 class="font-bold text-lg text-gray-700 border-b pb-2 mb-3">Cabang ${cabang}</h3>`;
                const grid = document.createElement("div");
                grid.className = "grid grid-cols-1 md:grid-cols-2 gap-4";
                
                let countLomba = 0;

                jenjangLomba[cabang].forEach(lomba => {
                    // LOGIKA PEMISAH SD KELAS 1-3 DAN 4-6
                    if (currentLembaga.jenjang === "SD") {
                        const isKelasBawah = /^[123]/.test(currentKelas);
                        const isKelasAtas = /^[456]/.test(currentKelas);
                        if (isKelasBawah && lomba.includes("(4-6)")) return;
                        if (isKelasAtas && lomba.includes("(1-3)")) return;
                    }

                    countLomba++;
                    const card = document.createElement("div");
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between";
                    card.innerHTML = `
                        <h4 class="font-semibold text-gray-800 mb-4 text-sm">${lomba}</h4>
                        <button onclick="openModalLomba('${lomba}', '${cabang}')" class="w-full py-2 bg-green-50 text-green-700 font-semibold rounded border border-green-200 hover:bg-green-100 transition text-sm">Kelola Peserta</button>
                    `;
                    grid.appendChild(card);
                });
                
                // Hanya tampilkan cabang jika ada lomba yang lolos filter
                if(countLomba > 0) {
                    wrapper.appendChild(grid);
                    container.appendChild(wrapper);
                }
            }
        }

        function openModalLomba(lomba, cabang) {
            currentModalContext = 'lomba';
            currentLombaAktif = { nama: lomba, cabang: cabang }; 
            document.getElementById("modal-title").innerText = "Peserta: " + lomba;
            const content = document.getElementById("modal-content");
            content.innerHTML = "";
            
            listSantriAktif.forEach((santri, index) => {
                const lombaTerpilih = stateEntry[santri];
                const isDiLombaIni = lombaTerpilih.find(l => l.nama === lomba) !== undefined;
                
                let isDisabled = false;
                let infoText = "";
                let bgClass = "hover:bg-gray-50";

                if (!isDiLombaIni) {
                    const isCabangSamaAda = lombaTerpilih.find(l => l.cabang === cabang);
                    if (isCabangSamaAda) {
                        isDisabled = true;
                        infoText = `<span class="text-[11px] text-red-500 font-bold block">Terkunci: Sudah mendaftar di Cabang ${cabang}</span>`;
                        bgClass = "bg-gray-100 opacity-60 cursor-not-allowed";
                    } else if (lombaTerpilih.length >= 2) {
                        isDisabled = true;
                        infoText = `<span class="text-[11px] text-red-500 font-bold block">Terkunci: Sudah mencapai batas 2 Lomba</span>`;
                        bgClass = "bg-gray-100 opacity-60 cursor-not-allowed";
                    }
                }

                if (lombaTerpilih.length > 0 && !isDisabled) {
                    const listNamaLomba = lombaTerpilih.filter(l => l.nama !== lomba).map(l => l.nama).join(", ");
                    if(listNamaLomba) {
                        infoText = `<span class="text-[11px] text-blue-500 font-medium block mt-1">Sudah ikut: ${listNamaLomba}</span>`;
                    }
                }

                const label = document.createElement("label");
                label.className = `p-3 border rounded-lg flex items-center gap-4 transition ${isDisabled ? bgClass : 'cursor-pointer ' + bgClass}`;
                
                label.innerHTML = `
                    <input type="checkbox" value="${santri}" class="w-5 h-5 text-green-600 border-gray-300 rounded focus:ring-green-500 modal-checkbox" 
                    ${isDiLombaIni ? "checked" : ""} ${isDisabled ? "disabled" : ""}>
                    <div class="flex-1 leading-tight">
                        <span class="font-semibold text-sm text-gray-800">${santri}</span>
                        ${infoText}
                    </div>
                `;
                content.appendChild(label);
            });
            
            document.getElementById("btn-simpan-modal").onclick = simpanDariModalLomba;
            document.getElementById("modal").classList.remove("hidden");
        }

        function simpanDariModalLomba() {
            const checkboxes = document.querySelectorAll('.modal-checkbox');
            let adaPerubahan = false;
            
            checkboxes.forEach(chk => {
                const santri = chk.value;
                const isChecked = chk.checked;
                const idxDiState = stateEntry[santri].findIndex(l => l.nama === currentLombaAktif.nama);

                if (isChecked && idxDiState === -1) {
                    stateEntry[santri].push(currentLombaAktif);
                    kirimDataKeGas(santri, currentLombaAktif.nama, "add");
                    adaPerubahan = true;
                } else if (!isChecked && idxDiState !== -1) {
                    stateEntry[santri].splice(idxDiState, 1);
                    kirimDataKeGas(santri, currentLombaAktif.nama, "remove");
                    adaPerubahan = true;
                }
            });

            if (adaPerubahan) alert("Perubahan peserta berhasil disimpan!");
            closeModal();
            if(!document.getElementById("mode-santri").classList.contains("hidden")) searchSantri();
        }

        // ================= MODE 2: ENTRY VIA SANTRI =================
        function searchSantri() {
            const keyword = document.getElementById("search-santri").value.toLowerCase();
            const container = document.getElementById("list-santri-search");
            container.innerHTML = "";
            
            const filtered = listSantriAktif.filter(s => s.toLowerCase().includes(keyword));
            
            filtered.forEach(santri => {
                const lombaTerpilih = stateEntry[santri];
                const item = document.createElement("div");
                item.className = "p-4 border rounded-xl flex flex-col sm:flex-row justify-between sm:items-center gap-3 bg-white";
                
                let textInfo = lombaTerpilih.length > 0 
                    ? `<span class="text-blue-600 font-semibold">${lombaTerpilih.map(l => l.nama).join("<br>")}</span>` 
                    : `<span class="text-gray-400">Belum ada lomba dipilih</span>`;
                
                item.innerHTML = `
                    <div class="w-full sm:w-1/2">
                        <p class="font-bold text-gray-800">${santri}</p>
                        <p class="text-xs mt-1 leading-relaxed">${textInfo}</p>
                    </div>
                    <div class="flex sm:w-auto items-center">
                        <button onclick="openModalSantri('${santri.replace(/'/g, "\\'")}')" class="px-4 py-2 bg-yellow-500 text-white font-semibold rounded hover:bg-yellow-600 text-sm transition">Ubah / Tambah Lomba</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function openModalSantri(santriStr) {
            currentModalContext = 'santri';
            currentSantriAktif = santriStr;
            document.getElementById("modal-title").innerText = "Kelola Lomba: " + santriStr;
            const content = document.getElementById("modal-content");
            content.innerHTML = "";
            
            const lombaTerpilih = stateEntry[santriStr];
            const jenjangLomba = MATA_LOMBA[currentLembaga.jenjang];
            
            for (let cabang in jenjangLomba) {
                const divCabang = document.createElement("div");
                divCabang.innerHTML = `<h4 class="font-bold text-gray-700 bg-gray-100 p-2 rounded text-sm mb-2">Cabang ${cabang}</h4>`;
                
                const isCabangTerisi = lombaTerpilih.find(l => l.cabang === cabang) !== undefined;
                const batasPenuh = lombaTerpilih.length >= 2;
                
                let countLomba = 0;

                jenjangLomba[cabang].forEach(lomba => {
                    // LOGIKA PEMISAH SD KELAS 1-3 DAN 4-6
                    if (currentLembaga.jenjang === "SD") {
                        const isKelasBawah = /^[123]/.test(currentKelas);
                        const isKelasAtas = /^[456]/.test(currentKelas);
                        if (isKelasBawah && lomba.includes("(4-6)")) return;
                        if (isKelasAtas && lomba.includes("(1-3)")) return;
                    }
                    
                    countLomba++;
                    const isChecked = lombaTerpilih.find(l => l.nama === lomba) !== undefined;
                    
                    let isDisabled = false;
                    let textRed = "";
                    if (!isChecked) {
                        if (isCabangTerisi) {
                            isDisabled = true;
                            textRed = " (Maks 1 per cabang)";
                        } else if (batasPenuh) {
                            isDisabled = true;
                            textRed = " (Batas 2 Lomba Penuh)";
                        }
                    }

                    const label = document.createElement("label");
                    label.className = `flex items-center gap-3 p-2 border-b ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:bg-gray-50'}`;
                    label.innerHTML = `
                        <input type="checkbox" value="${lomba}" data-cabang="${cabang}" class="w-4 h-4 text-green-600 modal-santri-checkbox" ${isChecked ? 'checked' : ''} ${isDisabled ? 'disabled' : ''}>
                        <span class="text-sm">${lomba} <span class="text-red-500 text-[10px]">${textRed}</span></span>
                    `;
                    
                    const chk = label.querySelector('input');
                    chk.addEventListener('change', () => {
                        updateStateTempDanRefreshModal(chk.value, chk.dataset.cabang, chk.checked);
                    });

                    divCabang.appendChild(label);
                });
                
                if(countLomba > 0) content.appendChild(divCabang);
            }

            document.getElementById("btn-simpan-modal").onclick = simpanDariModalSantri;
            document.getElementById("modal").classList.remove("hidden");
        }

        function updateStateTempDanRefreshModal(lomba, cabang, isChecked) {
            if (isChecked) {
                stateEntry[currentSantriAktif].push({nama: lomba, cabang: cabang});
                kirimDataKeGas(currentSantriAktif, lomba, "add");
            } else {
                const idx = stateEntry[currentSantriAktif].findIndex(l => l.nama === lomba);
                stateEntry[currentSantriAktif].splice(idx, 1);
                kirimDataKeGas(currentSantriAktif, lomba, "remove");
            }
            openModalSantri(currentSantriAktif); 
        }

        function simpanDariModalSantri() {
            closeModal();
            searchSantri();
        }

        // ================= KOMUNIKASI GAS & REKAP =================
        function kirimDataKeGas(namaSantri, namaLomba, action) {
            const payload = {
                jenjang: currentLembaga.jenjang,
                lembaga: currentLembaga.nama,
                kelas: currentKelas,
                nama: namaSantri,
                lomba: namaLomba,
                action: action // "add" atau "remove"
            };

            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => console.log('Terkirim:', action, namaLomba))
              .catch(e => console.error('Error:', e));
        }

        function closeModal() {
            document.getElementById("modal").classList.add("hidden");
        }

        // ================= REKAP DASHBOARD =================
        function bukaDashboardRekap() {
            showScreen("rekap");
            document.getElementById("rekap-loading").classList.remove("hidden");
            document.getElementById("rekap-content").classList.add("hidden");
            document.getElementById("rekap-content").innerHTML = "";

            fetch(GAS_URL)
                .then(res => res.json())
                .then(result => {
                    document.getElementById("rekap-loading").classList.add("hidden");
                    if(result.status === "success") {
                        renderRekapUI(result.data);
                    } else {
                        document.getElementById("rekap-content").innerHTML = `<p class="text-red-500">Gagal memuat data: ${result.message}</p>`;
                        document.getElementById("rekap-content").classList.remove("hidden");
                    }
                })
                .catch(err => {
                    document.getElementById("rekap-loading").classList.add("hidden");
                    document.getElementById("rekap-content").innerHTML = `<p class="text-red-500">Gagal terhubung ke server.</p>`;
                    document.getElementById("rekap-content").classList.remove("hidden");
                });
        }

        function renderRekapUI(dataRekap) {
            const container = document.getElementById("rekap-content");
            container.innerHTML = "";
            
            const orderTingkat = ["SD", "SMP", "SMA", "PGMI"];
            
            orderTingkat.forEach(tingkat => {
                const keyPutra = `${tingkat}_PUTRA`;
                const keyPutri = `${tingkat}_PUTRI`;
                
                if (dataRekap[keyPutra] || dataRekap[keyPutri]) {
                    const block = document.createElement("div");
                    block.className = "mb-8 border rounded-xl overflow-hidden shadow-sm";
                    
                    const header = document.createElement("div");
                    header.className = "bg-blue-800 text-white p-3 font-bold text-lg text-center";
                    header.innerText = `TINGKAT ${tingkat}`;
                    block.appendChild(header);
                    
                    const grid = document.createElement("div");
                    // KHUSUS PGMI HANYA ADA 1 KOLOM (PUTRI SAJA)
                    if(tingkat === "PGMI") {
                        grid.className = "grid grid-cols-1";
                        const colPutri = createColumnRekap("PUTRI", dataRekap[keyPutri], tingkat);
                        grid.appendChild(colPutri);
                    } else {
                        grid.className = "grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-200";
                        const colPutra = createColumnRekap("PUTRA", dataRekap[keyPutra], tingkat);
                        const colPutri = createColumnRekap("PUTRI", dataRekap[keyPutri], tingkat);
                        grid.appendChild(colPutra);
                        grid.appendChild(colPutri);
                    }
                    
                    block.appendChild(grid);
                    container.appendChild(block);
                }
            });
            container.classList.remove("hidden");
        }

        function createColumnRekap(genderTitle, dataGender, tingkat) {
            const div = document.createElement("div");
            div.className = "p-4 bg-gray-50 h-full";
            div.innerHTML = `<h4 class="font-bold text-center mb-4 text-blue-700">${genderTitle}</h4>`;
            
            if (!dataGender || Object.keys(dataGender).length === 0) {
                div.innerHTML += `<p class="text-sm text-center text-gray-400">Belum ada pendaftar</p>`;
                return div;
            }

            const orderCabang = ["Bahasa", "UTHQ", "KLIK"];
            const lombaStruktur = MATA_LOMBA[tingkat];

            orderCabang.forEach(cabang => {
                if(lombaStruktur[cabang]) {
                    let hasData = false;
                    let htmlList = `<ul class="space-y-1 mb-4">`;
                    
                    lombaStruktur[cabang].forEach(lombaName => {
                        if (dataGender[lombaName]) {
                            hasData = true;
                            htmlList += `<li class="flex justify-between text-sm border-b border-gray-200 pb-1">
                                <span class="text-gray-700">${lombaName}</span>
                                <span class="font-bold text-blue-600 bg-blue-100 px-2 rounded">${dataGender[lombaName]}</span>
                            </li>`;
                        }
                    });
                    
                    htmlList += `</ul>`;
                    
                    if (hasData) {
                        div.innerHTML += `<h5 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 mt-4 border-b-2 border-gray-300 inline-block">Cabang ${cabang}</h5>`;
                        div.innerHTML += htmlList;
                    }
                }
            });
            return div;
        }

        function tutupRekap() {
            showScreen(previousScreen || "gender");
        }
    </script>
</body>
</html>
